<!doctype html>
<html><head><meta charset="utf-8">
<style>
  html, body { margin: 0; background: #101418; }
  #root { position: relative; width: 1080px; height: 1920px; overflow: hidden; font-family: serif; color: #f4efe6; }
  .clip { position: absolute; inset: 0; }
  #box { position: absolute; left: 0; top: 0; width: 200px; height: 200px; background: #000; }
  #a h1 { position: absolute; left: 80px; top: 600px; font-size: 120px; margin: 0; }
  #b { background: #1d3b53; }
  #b .card { position: absolute; left: 140px; top: 800px; width: 800px; height: 400px; border-radius: 32px;
             background: #f4efe6; color: #1d3b53; font-size: 72px; padding: 48px; box-sizing: border-box;
             animation: slide 0.8s cubic-bezier(0.2, 0, 0, 1) 0s both; }
  @keyframes slide { from { transform: translateX(-900px); opacity: 0; } to { transform: none; opacity: 1; } }
  .dot { position: absolute; width: 40px; height: 40px; border-radius: 50%; background: #e0a458; }
</style></head>
<body>
<div id="root" data-composition-id="m0" data-width="1080" data-height="1920" data-duration="3" data-fps="30">
  <section id="a" class="clip" data-start="0" data-duration="1.5" data-track-index="0">
    <div id="box"></div>
    <h1><span class="w">Seek</span> <span class="w">every</span> <span class="w">frame</span></h1>
  </section>
  <section id="b" class="clip" data-start="1.2" data-duration="1.8" data-track-index="1">
    <div class="card">History-independent seek</div>
  </section>
</div>
<script>
  // Declarative, paused WAAPI with absolute delays (composition clock).
  const lin = { duration: 1000, delay: 0, fill: "both", easing: "linear" };
  document.getElementById("box").animate([{ background: "rgb(0,0,0)" }, { background: "rgb(255,255,255)" }], lin).pause();
  document.querySelectorAll("#a .w").forEach((w, i) => {
    w.style.display = "inline-block";
    w.animate([{ transform: "translateY(60px)", opacity: 0 }, { transform: "none", opacity: 1 }],
              { duration: 500, delay: 200 + i * 50, fill: "both", easing: "cubic-bezier(0.2,0,0,1)" }).pause();
  });
  for (let i = 0; i < 12; i++) {
    const d = document.createElement("div"); d.className = "dot";
    d.style.left = Math.round(__hf.rand("dot-x-" + i) * 1000) + "px";
    d.style.top = Math.round(1300 + __hf.rand("dot-y-" + i) * 500) + "px";
    document.getElementById("b").appendChild(d);
    d.animate([{ transform: "scale(0)" }, { transform: "scale(1)" }],
              { duration: 400, delay: 1500 + i * 40, fill: "both", easing: "ease-out" }).pause();
  }
</script>
</body></html>
