<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Social preview</title>
<!-- Social / Open Graph image, 1200 x 630. Copy it, replace the {{…}} placeholders and brand
     colours, then export:
       python .claude/skills/brand-assets/scripts/export_svg.py og-image.html --size 1200x630 --flatten "#ffffff" --out public
     Keep text inside the central 1080 x 540 area. Some platforms crop to 1.91:1 or to a square. -->
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;700;800&display=block" rel="stylesheet">
<style>
  :root { --bg1: #2a1bb0; --bg2: #5b4ff0; --accent: #9ff3cf; --ink: #ffffff; --sub: #dcd9ff; }
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
  body { font-family: Inter, sans-serif; color: var(--ink);
    background: radial-gradient(90% 90% at 90% 0%, rgba(255,255,255,.18), transparent 60%), linear-gradient(150deg, var(--bg1), var(--bg2)); }
  .wrap { position: absolute; left: 90px; top: 110px; width: 760px; }
  .brand { display: flex; align-items: center; gap: 20px; font-size: 38px; font-weight: 800; }
  .brand img { width: 84px; height: 84px; border-radius: 20px; }
  h1 { font-size: 70px; line-height: 1.05; letter-spacing: -0.025em; margin: 38px 0 0; font-weight: 800; }
  h1 em { font-style: normal; color: var(--accent); }
  p { font-size: 30px; color: var(--sub); margin: 26px 0 0; font-weight: 500; }
</style>
</head>
<body>
  <div class="wrap">
    <div class="brand"><img src="{{ICON_PATH}}" alt=""> {{BRAND}}</div>
    <h1>{{HEADLINE_WITH_<em>ACCENT</em>}}</h1>
    <p>{{ONE_LINE_BENEFIT}}</p>
  </div>
</body>
</html>
