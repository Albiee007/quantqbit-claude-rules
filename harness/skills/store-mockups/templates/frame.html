<!doctype html>
<html>
<head>
<meta charset="utf-8">
<!-- This page runs from <kit>/.build/, so every relative URL below resolves against the kit folder. -->
<base href="../">
<title>Store frame</title>
<!-- Store-mockup frame, format 2. Rendered by render_frames.py as .build/frame.html?f=<index|fg>&s=<size-key>.
     The look comes from the approved store concept, resolved by render_frames.py into
     .build/direction.generated.js (window.AD) and .build/fonts.generated.css. Nothing here sets
     a colour, typeface or layout of its own. 1.6 kits (no "format") render with templates/legacy-1.6/.
     &probe=1 lists every caption text run for the contrast and font checks; &nocap=1 hides the
     captions so the check can sample what is behind them.
     "style": "classic"    each frame is self-contained, laid out by its layout preset (artdir.js)
     "style": "continuous" the gallery is one strip; frame i is a window onto it (objects.js) -->
<link rel="stylesheet" href=".build/fonts.generated.css">
<link rel="stylesheet" href="app.css">
<style>
  html, body { margin: 0; overflow: hidden; }
  #canvas { position: relative; overflow: hidden; }
  #strip { position: absolute; left: 0; top: 0; }
  .cap h1 em, .cap p em { font-style: inherit; }
  .obj { position: absolute; transform-origin: center; }
</style>
</head>
<body>
<div id="canvas"></div>
<script src=".build/frames.generated.js"></script>
<script src=".build/direction.generated.js"></script>
<script src=".build/icons.generated.js"></script>
<script>
/* Icon helper shared by screens.js and objects.js. A name may be "ion-name|material_name": the
   half that matches the configured family is used (frames.json "icons": "ionicons" | "material" | "none"). */
function I(name, size, color, extra) {
  const [ion, ms] = String(name).includes('|') ? String(name).split('|') : [name, name];
  const style = `font-size:${size}px;${color ? `color:${color};` : ''}${extra || ''}`;
  if (window.ION && window.ION[ion] !== undefined) return `<span class="ion" style="${style}">${String.fromCodePoint(window.ION[ion])}</span>`;
  if (window.ICONS_NONE) return `<span class="ms" style="${style};width:1em;height:1em"></span>`;
  return `<span class="ms" style="${style}">${ms}</span>`;
}
</script>
<script src="demo-data.js"></script>
<script src="screens.js"></script>
<script src=".build/artdir.js"></script>
<script src=".build/objects.js"></script>
<script src=".build/props.generated.js"></script>
<!-- Optional: app-specific object types. A missing file is fine. -->
<script src="custom-objects.js"></script>
<script>
const CFG = window.FRAMES;
const AD = window.AD;
const q = new URLSearchParams(location.search);
const sizeKey = q.get('s');
const [W, H, platform] = CFG.sizes[sizeKey];
const canvas = document.getElementById('canvas');
Object.assign(canvas.style, { width: W + 'px', height: H + 'px' });
const wide = W / H > 0.6;

const SW = 900, SH = platform === 'ios' ? 1950 : 2000;

function screenHTML(name) {
  if (!SCREENS[name]) throw new Error(`screens.js has no screen named "${name}"`);
  return `<div class="screen ${platform}" style="height:${SH}px">${statusBar(platform)}${SCREENS[name](platform)}<div class="homebar"></div></div>`;
}

/* The largest device that fits maxW x maxH. */
function fit(name) {
  return (maxW, maxH) => {
    const bz = AD.device.style === 'frame' ? 52 : 0;
    const s = Math.min(maxW / (SW + bz), maxH / (SH + bz));
    return ArtDir.device(screenHTML(name), SW, SH, s);
  };
}

function frameBg(fr) { return fr.background || AD.defaultBackground; }
function frameLayout(fr) { return fr.layout || AD.defaultLayout; }

/* ---------------- classic: one self-contained frame ---------------- */
function storeFrame(fr) {
  const bgName = frameBg(fr);
  canvas.style.background = ArtDir.background(ArtDir.bg(bgName));
  const layout = ArtDir.layouts.store[frameLayout(fr)];
  const dev = layout({ W, H, parent: canvas, left: 0, frame: fr, bgName, wide, fit: fit(fr.screen) });
  if (AD.motif) {
    const r = dev.el.getBoundingClientRect();
    const m = ArtDir.motif(canvas, W, H, { x: r.left + r.width / 2, y: r.top + r.height / 2 });
    canvas.insertBefore(m, canvas.firstChild);
  }
}

/* ---------------- continuous: one strip, this frame is a window onto it ---------------- */
function continuousStrip(index) {
  const N = CFG.frames.length;
  const G = (CFG.gutter || 0) * (W / 1080);
  const stripW = N * W + (N - 1) * G;
  const left = (i) => i * (W + G);
  const strip = document.createElement('div');
  strip.id = 'strip';
  Object.assign(strip.style, { width: stripW + 'px', height: H + 'px', transform: `translateX(${-left(index)}px)` });
  canvas.appendChild(strip);
  CFG.frames.forEach((fr, i) => {
    const el = document.createElement('div');
    Object.assign(el.style, { position: 'absolute', left: left(i) + 'px', top: 0, width: W + G + 'px', height: H + 'px',
      background: ArtDir.background(ArtDir.bg(frameBg(fr))) });
    strip.appendChild(el);
  });
  if (AD.motif) CFG.frames.forEach((_, i) => { const m = ArtDir.motif(strip, W, H); m.style.left = left(i) + parseFloat(m.style.left) + 'px'; });

  const u = {
    W, H, AD, R: AD.roles, T: AD.type, I, esc: ArtDir.esc, copy: ArtDir.copy, stripW,
    X: (x) => x * (W + G), Y: (y) => y * H, S: (w) => w * W,
    device: (name, widthPx) => fit(name)(widthPx, Infinity).el.outerHTML,
  };
  const place = (o) => {
    const render = OBJECTS[o.type];
    if (!render) throw new Error(`unknown object type "${o.type}" (add it to custom-objects.js)`);
    if (o.type === 'ribbon') { strip.insertAdjacentHTML('beforeend', render(o, u)); return; }
    const el = document.createElement('div');
    el.className = 'obj';
    const w = u.S(o.w ?? 0.3);
    Object.assign(el.style, { left: u.X(o.x ?? 0) + 'px', top: u.Y(o.y ?? 0.5) + 'px', width: w + 'px', fontSize: w / 10 + 'px',
      opacity: o.opacity ?? 1, transform: `translate(-50%, -50%) rotate(${o.rotate || 0}deg)` });
    el.innerHTML = render(o, u);
    strip.appendChild(el);
  };
  const objs = CFG.objects || [];
  const back = (o) => o.z === 'back' || (o.type === 'ribbon' && o.z !== 'front');
  objs.filter(back).forEach(place);

  // Per-frame caption and primary phone (the phone always stays inside its own frame).
  CFG.frames.forEach((fr, i) => {
    const bgName = frameBg(fr);
    const pad = W * 0.07;
    const head = Math.min(W * AD.caption.headScale, H * 0.05);
    const bottomCap = (fr.caption || {}).pos === 'bottom';
    const cap = ArtDir.caption(strip, fr, bottomCap
      ? { left: left(i) + pad, width: W - 2 * pad, bottom: H * 0.95, headPx: head, bgName }
      : { left: left(i) + pad, width: W - 2 * pad, top: H * 0.05, headPx: head, bgName });
    if (!fr.screen) return;
    const dv = fr.device || {};
    const room = bottomCap ? cap.offsetTop - H * 0.06 : H - (cap.offsetTop + cap.offsetHeight + H * 0.03) - H * 0.025;
    const bleed = dv.bleed === 'bottom' ? 1.18 : 1;
    const d = fit(fr.screen)(W * (wide ? 0.66 : 0.8) * (dv.scale || 1) * bleed, room * (dv.scale || 1) * bleed);
    const cx = left(i) + (dv.x ?? 0.5) * W;
    const top = dv.y !== undefined ? dv.y * H - d.h / 2 : bottomCap ? H * 0.05 : cap.offsetTop + cap.offsetHeight + H * 0.03;
    Object.assign(d.el.style, { left: cx - d.w / 2 + 'px', top: top + 'px', transform: `rotate(${dv.rotate || 0}deg)` });
    strip.appendChild(d.el);
  });

  objs.filter((o) => !back(o)).forEach(place);
}

function featureGraphic(fg) {
  const bgName = fg.background || AD.featureGraphic.background;
  canvas.style.background = ArtDir.background(ArtDir.bg(bgName));
  const layout = ArtDir.layouts.feature[fg.layout || AD.featureGraphic.layout];
  layout({ W, H, parent: canvas, left: 0, fg, bgName, wide: true, fit: fit(fg.screen) });
  if (AD.motif) canvas.insertBefore(ArtDir.motif(canvas, W, H), canvas.firstChild);
}

ArtDir.loadFaces(AD.faces, window.EXTRA_FONTS, 8000).then(() => {
  if (q.get('f') === 'fg') featureGraphic(CFG.featureGraphic);
  else if (CFG.style === 'continuous') continuousStrip(Number(q.get('f')));
  else storeFrame(CFG.frames[Number(q.get('f'))]);
  if (q.get('nocap')) document.head.insertAdjacentHTML('beforeend', '<style>.cap { visibility: hidden !important; }</style>');
  if (q.get('probe')) ArtDir.probe(W, H);
  document.title = 'ready';
});
</script>
</body>
</html>
