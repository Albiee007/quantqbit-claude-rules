name: video-spike

# M0 spike for the brand-video renderer: seek contract, worker equivalence, readiness and an
# H.264 encode on all three runner OSes. Runs only on spike branches or on demand.
on:
  push:
    branches: ['spike/**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  m0:
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        variant: [default]
        include:  # macOS showed history-dependent frames with the defaults; try the fixes
          - {os: macos-latest, variant: raf, args: "--raf"}
          - {os: macos-latest, variant: stages, args: "--flags='--run-all-compositor-stages-before-draw --disable-partial-raster --disable-checker-imaging'"}
          - {os: macos-latest, variant: stages-raf, args: "--raf --flags='--run-all-compositor-stages-before-draw --disable-partial-raster --disable-checker-imaging'"}
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install Pillow
        run: python -m pip install "pillow>=10"
      - name: Install ffmpeg
        run: |
          case "$RUNNER_OS" in
            Linux)   sudo apt-get update -q && sudo apt-get install -y -q ffmpeg ;;
            macOS)   brew install ffmpeg ;;
            Windows) choco install ffmpeg -y --no-progress ;;
          esac
          ffmpeg -version | head -1
      - name: Run the M0 spike
        run: python tests/spikes/video-m0/run.py --trials 30 ${{ matrix.args }} | tee m0-${{ matrix.os }}-${{ matrix.variant }}.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: m0-${{ matrix.os }}-${{ matrix.variant }}
          path: m0-${{ matrix.os }}-${{ matrix.variant }}.json
