name: validate

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      equiv_base:
        description: 'Git ref for the scaffold renderer equivalence check (empty = skip)'
        required: false
        default: ''
  schedule:
    - cron: '17 6 * * 1'

permissions:
  contents: read

jobs:
  harness:
    timeout-minutes: 75  # a hung browser fails the job instead of holding it for six hours
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0  # store-render parity check renders with the v1.6.1 scripts (git archive v1.6.1)
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
      - name: Install Claude Code CLI (for `claude plugin validate`)
        run: npm install -g @anthropic-ai/claude-code
      - name: Install shellcheck (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
      - name: Git identity for test repos
        run: git config --global user.email ci@example.com && git config --global user.name ci
      - name: Validate harness (policy, frontmatter, budgets, links, plugin manifest, release consistency)
        run: bash scaffold/lib/validate-harness.sh
      - name: Hook tests
        run: bash tests/hooks.test.sh
      - name: Helper and path containment regressions
        run: bash tests/helpers.test.sh
      - name: Validator tests
        run: bash tests/validate.test.sh
      - name: Store asset checker tests (fixtures generated with Pillow)
        run: python -m pip install -q "pillow>=10" && bash tests/store-assets.test.sh
      - name: Story art export tests (fixtures generated with Pillow)
        run: bash tests/story-art.test.sh
      - name: Colour, token and type tool tests (stdlib only)
        run: bash tests/color-tools.test.sh
      - name: Creative direction, concepts, approvals and production gates
        run: bash tests/creative-direction.test.sh
      - name: Store render, brand export and icon tests (headless Chrome from the runner image)
        run: bash tests/store-render.test.sh
      - name: Media variety demonstration (two projects, same screens, different approved looks)
        env:
          VARIETY_SHEET: ${{ runner.temp }}/variety-sheet-${{ matrix.os }}.png
        run: bash tests/media-variety.test.sh
      - name: Upload the variety sheet for review
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: variety-sheet-${{ matrix.os }}
          path: ${{ runner.temp }}/variety-sheet-${{ matrix.os }}.png
          if-no-files-found: ignore
      - name: Install ffmpeg (video renders)
        run: |
          case "$RUNNER_OS" in
            Linux)   sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg ;;
            macOS)   brew install ffmpeg ;;
            Windows) choco install ffmpeg -y --no-progress ;;
          esac
          ffmpeg -hide_banner -version | head -1
      - name: Video tests (seek contract, gates, render, encode, reviews)
        run: bash tests/video.test.sh
      - name: Sync scenario tests
        run: bash tests/sync.test.sh
      - name: macOS stock bash 3.2 compatibility (hooks + sync + scaffold)
        if: runner.os == 'macOS'
        run: |
          command -v envsubst || brew install gettext
          PATH="/bin:/usr/bin:$PATH" bash --version | head -1
          PATH="/bin:/usr/bin:$PATH" /bin/bash tests/hooks.test.sh
          PATH="/bin:/usr/bin:$PATH" /bin/bash tests/sync.test.sh
          PATH="/bin:/usr/bin:$PATH" /bin/bash tests/scaffold.test.sh
      - name: Scaffold transaction tests (Windows Git Bash, trimmed)
        if: runner.os == 'Windows'
        env:
          SCAFFOLD_PLATFORM: backend
          SCAFFOLD_QUICK: '1'
        run: bash tests/scaffold.test.sh
      - name: Windows PowerShell entry points
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $p = Join-Path $env:RUNNER_TEMP 'ps-proj'
          New-Item -ItemType Directory -Force $p | Out-Null
          git -C $p init -q
          New-Item -ItemType Directory -Force (Join-Path $p '.claude') | Out-Null
          '{"permissions":{"allow":["Bash(npm test)"]}}' | Set-Content -Encoding utf8 (Join-Path $p '.claude/settings.json')
          git -C $p add -A; git -C $p commit -qm init
          powershell -NoProfile -ExecutionPolicy Bypass -File scaffold\sync.ps1 --target $p --commit
          if ($LASTEXITCODE -ne 0) { throw "sync.ps1 failed: $LASTEXITCODE" }
          powershell -NoProfile -ExecutionPolicy Bypass -File (Join-Path $p '.claude\harness\bin\harness-doctor.ps1')
          if ($LASTEXITCODE -ne 0) { throw "harness-doctor.ps1 failed: $LASTEXITCODE" }
          git -C $p log --oneline -1

  # Generated JavaScript starters on the oldest supported Node LTS and the
  # current one. Weekly runs catch dependency drift without template changes.
  scaffolds:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        platform: [backend, frontend, mobile]
        node: ['22', '24']
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq gettext-base
      - name: Render starters and check generated applications
        env:
          SCAFFOLD_BUILD: '1'
          SCAFFOLD_PLATFORM: ${{ matrix.platform }}
        run: bash tests/scaffold.test.sh

  # On demand, for renderer refactors: prove generated output is unchanged
  # against a base ref, on Linux bash and macOS stock bash 3.2.
  scaffold-equiv:
    if: github.event_name == 'workflow_dispatch' && inputs.equiv_base != ''
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: envsubst
        run: command -v envsubst || { if [ "$RUNNER_OS" = Linux ]; then sudo apt-get install -y -qq gettext-base; else brew install gettext; fi; }
      - name: Renderer equivalence against ${{ inputs.equiv_base }}
        env:
          SCAFFOLD_EQUIV_BASE: ${{ inputs.equiv_base }}
        run: |
          if [ "$RUNNER_OS" = macOS ]; then PATH="/bin:/usr/bin:$PATH" /bin/bash tests/scaffold-equiv.test.sh
          else bash tests/scaffold-equiv.test.sh; fi

  # The Android starter built natively: the committed Gradle wrapper is
  # validated, then the generated project is assembled, unit-tested, ktlinted
  # and linted. The runner image ships an Android SDK; AGP installs any
  # missing platform itself.
  android-native:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: gradle/actions/wrapper-validation@v6
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq gettext-base
      - name: Render the Android starter; build, test and lint it
        env:
          SCAFFOLD_BUILD: '1'
          SCAFFOLD_PLATFORM: android
        run: bash tests/scaffold.test.sh
